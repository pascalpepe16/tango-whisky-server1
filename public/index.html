<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TANGO WHISKY eQSL</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<header>
  <h1>TANGO WHISKY eQSL</h1>
</header>

<nav>
  <button onclick="showTab('home')">Accueil</button>
  <button id="btnGallery" onclick="showTab('gallery')">Galerie</button>
  <button id="btnCreate" onclick="showTab('create')">Créer</button>
  <button onclick="showTab('download')">Télécharger</button>
</nav>

<main>

<section id="home" class="section">
  <h2>Bienvenue</h2>
</section>

<section id="gallery" class="section hidden">
  <h2>Galerie</h2>
  <div id="galleryContent"></div>
</section>

<section id="create" class="section hidden">

<h2>Créer QSL</h2>

<form id="genForm">
  <input name="indicatif" placeholder="Indicatif" required>
  <input name="date" type="date">
  <input name="time" type="time">
  <input name="band" placeholder="Bande">
  <input name="mode" placeholder="Mode">
  <input name="report" placeholder="Report">
  <textarea name="note" placeholder="Note"></textarea>
  <input type="file" name="qsl" required>

  <button type="submit">Générer</button>
</form>

<div id="genPreview"></div>

<hr>

<h3>Import CSV / XLSX</h3>

<input type="file" id="importFile">
<input type="file" id="bulkImage">

<button onclick="processFile()">Importer</button>
<button id="validateImportBtn">Envoyer</button>

<div id="progressContainer">
  <div class="progressBarBg">
    <div id="progressBar"></div>
  </div>
</div>

<div id="previewArea"></div>

</section>

<section id="download" class="section hidden">
  <h2>Télécharger</h2>

  <input id="dlCall" placeholder="Indicatif">
  <button id="btnSearch">Rechercher</button>

  <div id="dlPreview"></div>
</section>

</main>

<script src="script.js"></script>
</body>
</html>
