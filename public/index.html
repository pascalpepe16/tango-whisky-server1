<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TANGO WHISKY eQSL</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

<header>
  <img src="https://res.cloudinary.com/dqpvrfjeu/image/upload/v1763588704/akyt1anm1inwmygj3vfz.png" class="logo" alt="TW">
  <h1>TANGO WHISKY eQSL</h1>
</header>

<nav>
  <button onclick="showTab('home')">Accueil</button>
  <button id="btnGallery" style="display:none;" onclick="showTab('gallery')">Galerie</button>
  <button id="btnCreate" style="display:none;" onclick="showTab('create')">Créer / Ajouter</button>
  <button onclick="showTab('download')">Télécharger</button>
  <button id="logoutBtn" onclick="logout()" style="display:none;">Déconnexion</button>
</nav>

<div id="loginBox" class="box">
  <h3>Connexion</h3>
  <input type="text" id="loginIndicatif" placeholder="Indicatif (ex: 14tw101)">
  <input type="password" id="loginPassword" placeholder="Mot de passe">
  <div class="btns">
    <button class="primary" onclick="login()">Connexion</button>
  </div>
  <p id="loginError" style="color:red;"></p>
</div>

<main>

<section id="home" class="section">
  <h2>Bienvenue</h2>
  <p>Portail eQSL TANGO WHISKY – 73' de l'équipe</p>
</section>

<section id="gallery" class="section hidden">
  <h2>Galerie</h2>
  <div id="galleryContent">Chargement…</div>
</section>

<section id="create" class="section hidden">
  <h2>Créer / Générer une QSL</h2>

  <div class="importBox">
    <h3>Import CSV / Excel</h3>
    <input type="file" id="importFile" accept=".csv,.xlsx"><br><br>
    <label>Image pour toutes les QSL :</label><br>
    <input type="file" id="bulkImage" accept="image/*"><br><br>
    <button onclick="processFile()">Importer</button>
    <button id="validateImportBtn" style="display:none;">Valider et enregistrer</button>
    <div id="importStatus"></div>
    <div id="previewArea"></div>
    <div id="progressContainer">
      <div class="progressBarBg">
        <div id="progressBar"></div>
      </div>
    </div>
  </div>

  <form id="genForm" enctype="multipart/form-data" class="wideForm">
    <div class="twoColumns">
      <div>
        <label>Indicatif :</label>
        <input type="text" name="indicatif" required>
        <label>Date :</label>
        <input type="date" name="date">
        <label>Heure :</label>
        <input type="time" name="time">
        <label>Bande :</label>

<div style="display:flex; gap:8px; align-items:center;">
  
  <!-- Sélecteur bande -->
  <select name="band" id="bandSelect" required>
    <option value="">Bande</option>
    <option value="26">26</option>
    <option value="27">27</option>
    <option value="28">28</option>
   
  </select>

  <!-- Complément fréquence -->
  <input 
    type="text" 
    id="bandDetail" 
    placeholder="ex: 555" 
    style="width:80px;"
  >

  <span>MHz</span>

</div>
        <label>Report :</label>
        <input type="text" name="report">
      </div>
      <div>
        <label>Mode :</label>
        <select name="mode" required>
          <option value="">Sélectionner...</option>
          <option value="USB">USB</option>
          <option value="SSB">SSB</option>
          <option value="FM">FM</option>
          <option value="AM">AM</option>
          <option value="RTTY">RTTY</option>
          <option value="PSK31">PSK31</option>
          <option value="FT8">FT8</option>
          <option value="SSTV">SSTV</option>
          <option value="CW">CW</option>
        </select>
        <label>Note :</label>
        <textarea name="note"></textarea>
        <label>Image QSL :</label>
        <input type="file" name="qsl" accept="image/*" required>
      </div>
    </div>
    <button class="primary" type="submit">Générer QSL</button>
    <div id="genPreview"></div>
  </form>
</section>

<section id="download" class="section hidden">
  <h2>Télécharger</h2>
  <div class="dlSearch">
    <input id="dlCall" placeholder="Votre indicatif">
    <button id="btnSearch" class="primary">Rechercher</button>
  </div>
  <div id="dlPreview"></div>
</section>

<a href="https://www.facebook.com/groups/1114993245182627" target="_blank" id="fbFooterLink">
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png">
</a>

</main>

<div id="qslPopup" class="popup hidden">
  <div class="popupBox">
    <p>📡 Nouvelle QSL disponible !</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<footer>
  TANGO WHISKY © 2026
</footer>

<script src="script.js"></script>

</body>
</html>
