<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TW-eQSL</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header>
  <img src="logo.png" class="logo logo-hover">
  <h1>TW-eQSL</h1>
</header>

<nav>
  <button id="btnHome" onclick="showTab('home')">Accueil</button>
  <button id="btnGallery" onclick="showTab('gallery')">Galerie</button>
  <button id="btnCreate" onclick="showTab('create')">Créer QSL</button>
  <button id="logoutBtn" onclick="logout()">Déconnexion</button>
</nav>

<div id="home" class="section">
  <h2>Bienvenue sur TW-eQSL</h2>
</div>

<div id="gallery" class="section hidden">
  <div id="galleryContent"></div>
</div>

<div id="create" class="section hidden">
  <form id="genForm" class="wideForm">
    <input type="text" name="indicatif" placeholder="Indicatif" required>
    <input type="date" name="date" required>
    <input type="time" name="time" required>
    <input type="text" name="band" placeholder="Bande" required>
    <input type="text" name="mode" placeholder="Mode" required>
    <input type="text" name="report" placeholder="Report" required>
    <textarea name="note" placeholder="Note"></textarea>
    <input type="file" name="qsl" required>
    <button type="submit" class="primary">Générer QSL</button>
  </form>

  <div id="genPreview"></div>
</div>

<!-- Onglet Facebook -->
<a href="https://www.facebook.com/groups/1114993245182627" target="_blank" id="fbTab">FB</a>

<footer>
  TW-eQSL &copy; 2026
</footer>

<script src="script.js"></script>
</body>
</html>
