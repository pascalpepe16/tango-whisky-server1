<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TANGO WHISKY eQSL</title>

  <link rel="stylesheet" href="style.css">

  <!-- Librairies pour import Excel/CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<header>
  <img src="https://res.cloudinary.com/dqpvrfjeu/image/upload/v1763588704/akyt1anm1inwmygj3vfz.png"
       class="logo" alt="TW">
  <h1>TANGO WHISKY eQSL</h1>
</header>

<nav>
  <button onclick="showTab('home')">Accueil</button>

  <button id="btnGallery" style="display:none;" onclick="showTab('gallery')">
    Galerie
  </button>

  <button id="btnCreate" style="display:none;" onclick="showTab('create')">
    Créer / Ajouter
  </button>

  <button onclick="showTab('download')">Télécharger</button>

  <button id="logoutBtn" onclick="logout()" style="display:none;">
    Déconnexion
  </button>
</nav>

<div id="loginBox" class="box">
  <h3>Connexion</h3>
  <input type="text" id="loginIndicatif" placeholder="Indicatif (ex: 14tw101)">
  <input type="password" id="loginPassword" placeholder="Mot de passe">
  <div class="btns">
    <button class="primary" onclick="login()">Connexion</button>
  </div>
  <p id="loginError" style="color:red;"></p>
</div>

<main>

<section id="home" class="section">
  <h2>Bienvenue</h2>
  <p>Portail eQSL TANGO WHISKY – 73' de l'équipe</p>
</section>

<section id="gallery" class="section hidden">
  <h2>Galerie</h2>
  <div id="galleryContent">Chargement…</div>
</section>

<section id="create" class="section hidden">
  <h2>Créer / Générer une QSL</h2>

  <!-- IMPORT CSV -->
  <div class="box">
    <h3>Import CSV / Excel</h3>

    <input type="file" id="importFile" accept=".csv,.xlsx"><br><br>

    <label>Image pour toutes les QSL importées :</label><br>
    <input type="file" id="bulkImage" accept="image/*"><br><br>

    <button onclick="processFile()">Importer</button>
    <button id="validateImportBtn" style="display:none;">
      Valider et enregistrer
    </button>

    <div id="importStatus" style="margin-top:10px;"></div>

    <!-- Prévisualisation -->
    <div id="previewArea" style="margin-top:10px;"></div>

    <!-- Barre de progression -->
    <div id="progressContainer" style="display:none;margin-top:10px;">
      <div style="background:#ccc;height:20px;border-radius:10px;">
        <div id="progressBar"
             style="width:0%;height:100%;background:#28a745;border-radius:10px;">
        </div>
      </div>
    </div>
  </div>

  <!-- CREATION CLASSIQUE -->
  <div class="box">
    <h3>Création classique</h3>

    <form id="genForm" enctype="multipart/form-data" class="wideForm">

      <div class="twoColumns">
        <div>
          <label>Indicatif :</label>
          <input type="text" name="indicatif" required>

          <label>Date (UTC) :</label>
          <input type="date" id="inputDate" name="date">

          <label>Heure (UTC) :</label>
          <input type="time" id="inputTime" name="time">

          <label>Bande :</label>
          <input type="text" name="band">

          <label>Report :</label>
          <input type="text" name="report">
        </div>

        <div>
          <label>Mode :</label>
          <input type="text" name="mode">

          <label>Note :</label>
          <textarea name="note"></textarea>

          <label>Image QSL :</label>
          <input type="file" name="qsl" accept="image/*" required>
        </div>
      </div>

      <button class="primary" type="submit">Générer QSL</button>
      <div id="genPreview" class="preview"></div>
    </form>
  </div>

  <!-- CREATION PREMIUM -->
  <div class="box">
    <h3>Création premium (avec aperçu)</h3>

    <div class="twoColumns">
      <div>
        <label>Indicatif :</label>
        <input type="text" id="callsignPremium" oninput="updatePreview()">

        <label>Date :</label>
        <input type="date" id="datePremium" oninput="updatePreview()">

        <label>Mode :</label>
        <input type="text" id="modePremium" oninput="updatePreview()">

        <label>RST :</label>
        <input type="text" id="rstPremium" oninput="updatePreview()">

        <label>Fond :</label>
        <select id="backgroundSelect" onchange="updatePreview()">
          <option value="bg1.jpg">Fond 1</option>
          <option value="bg2.jpg">Fond 2</option>
        </select>

        <button class="primary" onclick="createPremiumQSL()">
          Générer QSL Premium
        </button>
      </div>

      <!-- PREVIEW -->
      <div>
        <div id="previewCard" class="previewCard">
          <div class="p_callsign">CALL</div>
          <div class="p_date">DATE</div>
          <div class="p_mode">MODE</div>
          <div class="p_rst">RST</div>
        </div>
      </div>
    </div>
  </div>

</section>

<section id="download" class="section hidden">
  <h2>Télécharger</h2>
  <div class="dlSearch">
    <input id="dlCall" placeholder="Votre indicatif">
    <button id="btnSearch" class="primary">Rechercher</button>
  </div>
  <div id="dlPreview"></div>
</section>

</main>

<footer>
  TANGO WHISKY © 2025
</footer>

<script src="script.js"></script>
</body>
</html>
