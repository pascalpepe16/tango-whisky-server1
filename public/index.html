<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TANGO WHISKY eQSL</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<header>
  <img src="https://res.cloudinary.com/dqpvrfjeu/image/upload/v1763588704/akyt1anm1inwmygj3vfz.png" class="logo">
  <h1>TANGO WHISKY eQSL</h1>
</header>

<nav>
  <button onclick="showTab('home')">Accueil</button>
  <button id="btnGallery" style="display:none;" onclick="showTab('gallery')">Galerie</button>
  <button id="btnCreate" style="display:none;" onclick="showTab('create')">Créer / Ajouter</button>
  <button onclick="showTab('download')">Télécharger</button>
  <button id="logoutBtn" onclick="logout()" style="display:none;">Déconnexion</button>
</nav>

<div id="loginBox" class="box">
  <h3>Connexion</h3>
  <input type="text" id="loginIndicatif" placeholder="Indicatif">
  <input type="password" id="loginPassword" placeholder="Mot de passe">
  <button class="primary" onclick="login()">Connexion</button>
  <p id="loginError"></p>
</div>

<main>

<section id="home" class="section">
  <h2>Bienvenue</h2>
</section>

<section id="gallery" class="section hidden">
  <h2>Galerie</h2>
  <div id="galleryContent"></div>
</section>

<section id="create" class="section hidden">
  <h2>Créer / Générer une QSL</h2>

  <div class="importBox">
    <input type="file" id="importFile" accept=".csv,.xlsx">
    <input type="file" id="bulkImage" accept="image/*">
    <button onclick="processFile()">Importer</button>
    <button id="validateImportBtn" style="display:none;">Valider</button>

    <div id="importStatus"></div>
    <div id="previewArea"></div>

    <div id="progressContainer">
      <div class="progressBarBg">
        <div id="progressBar"></div>
      </div>
    </div>
  </div>

  <form id="genForm">
    <input name="indicatif" placeholder="Indicatif" required>
    <input name="date" type="date">
    <input name="time" type="time">
    <input name="band" placeholder="Bande">
    <input name="mode" placeholder="Mode">
    <input name="report" placeholder="Report">
    <textarea name="note"></textarea>
    <input name="qsl" type="file" required>
    <button class="primary">Générer</button>
    <div id="genPreview"></div>
  </form>
</section>

<section id="download" class="section hidden">
  <input id="dlCall">
  <button id="btnSearch">Rechercher</button>
  <div id="dlPreview"></div>
</section>

</main>

<!-- FB FIXE -->
<a href="https://www.facebook.com/groups/1114993245182627" target="_blank" id="fbFooterLink">
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png">
</a>

<footer>TANGO WHISKY © 2026</footer>

<script src="script.js"></script>
</body>
</html>
